[package]
name = "asr"
version = "0.0.2"
edition = "2024"
authors = ["altunenes", "dhawal"]
description = "Fast ASR with nemotron"
repository = "https://github.com/beyondgrayzone/asr-server"
license = "MIT OR Apache-2.0"
keywords = ["speech-recognition", "asr", "parakeet", "onnx", "nvidia"]
categories = ["multimedia::audio", "science"]

[dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "api-24"] }
hound = "3.5"
eyre = "0.6"
ndarray = "0.17"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
realfft = "3"

[dev-dependencies]

[features]
default = ["cpu", "ort-defaults"]
cpu = []
ort-defaults = ["ort/default"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
migraphx = ["ort/migraphx"]
openvino = ["ort/openvino"]
webgpu = ["ort/webgpu"]
nnapi = ["ort/nnapi"]
sortformer = []
multitalker = ["sortformer"]
cohere = []
# WARNING: enabling this DEADLOCKS the server at runtime unless a matching
# `libonnxruntime.so` is already installed system-wide.
#
# Without one, `ort` calls `dlopen`, that fails, and the error-reporting path
# re-enters `ort::api()` while its `OnceLock` is still initializing -- a
# self-deadlock on a `std::sync::Once` futex. The process hangs forever with no
# output and the loader thread sits at 0% CPU in `futex_wait`. The BUILD STILL
# SUCCEEDS, so it is easy to mistake for a slow model load.
#
# `src/glibc_compat.rs` already handles the prebuilt-binary glibc mismatch, so a
# plain `cargo build` works on glibc < 2.38 and this feature is never needed.
# It is therefore gated behind `build.rs`: opting in requires setting
# ASR_ALLOW_LOAD_DYNAMIC=1, which turns a silent runtime hang into a loud build
# failure.
load-dynamic = ["ort/load-dynamic"]
preload-dylibs = ["ort/preload-dylibs"]
